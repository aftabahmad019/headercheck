name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -v

  docker:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Build Docker image
        run: docker build -t headercheck .

      - name: Smoke test - usage error returns exit code 2
        run: |
          set +e
          docker run --rm headercheck
          test $? -eq 2

      - name: Container runs as non-root user
        run: test "$(docker run --rm --entrypoint whoami headercheck)" = "appuser"