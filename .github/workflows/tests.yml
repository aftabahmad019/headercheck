name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests with coverage
        run: pytest -v --cov=headercheck --cov-report=term-missing --cov-report=html --cov-fail-under=90

      - name: Add coverage summary
        run: coverage report --format=markdown >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage report
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: htmlcov/

  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - name: Build Docker image
        run: docker build -t headercheck .

      - name: Smoke test - usage error returns exit code 2
        run: |
          set +e
          docker run --rm headercheck
          test $? -eq 2

      - name: Container runs as non-root user
        run: test "$(docker run --rm --entrypoint whoami headercheck)" = "appuser"

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag headercheck ghcr.io/aftabahmad019/headercheck:latest
          docker tag headercheck ghcr.io/aftabahmad019/headercheck:${{ github.sha }}
          docker push ghcr.io/aftabahmad019/headercheck:latest
          docker push ghcr.io/aftabahmad019/headercheck:${{ github.sha }}